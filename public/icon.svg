<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="vaultGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle outer border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="6"/>

  <!-- Shield Vault Silhouette -->
  <path d="M256 90 L380 144 V260 C380 344 326 408 256 432 C186 408 132 344 132 260 V144 Z" 
        fill="url(#vaultGlow)" opacity="0.95" />

  <!-- Vault Inner Highlight -->
  <path d="M256 114 L356 160 V256 C356 324 312 378 256 400 C200 378 156 324 156 256 V160 Z" 
        fill="#0F172A" opacity="0.85" />

  <!-- Photo Aperture / Camera & Memories Core -->
  <circle cx="256" cy="245" r="58" fill="#1E293B" stroke="#60A5FA" stroke-width="8"/>
  <circle cx="256" cy="245" r="34" fill="#3B82F6"/>
  <circle cx="268" cy="233" r="10" fill="#FFFFFF" opacity="0.9"/>

  <!-- Safe Keyhole / Security Notch -->
  <path d="M251 316 L248 350 H264 L261 316 Z" fill="#60A5FA"/>
  <circle cx="256" cy="316" r="10" fill="#60A5FA"/>

  <!-- Warm Memory Sparkle Star at Top Right -->
  <path d="M340 180 Q356 180 356 164 Q356 180 372 180 Q356 180 356 196 Q356 180 340 180 Z" fill="url(#starGlow)"/>
</svg>
