    <script>
      // In cloud container environments where HMR WebSockets are not supported or proxied,
      // safely prevent unhandled WebSocket closure rejections from bubbling as fatal app crashes.
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && typeof e.reason.message === 'string' && (e.reason.message.includes('WebSocket') || e.reason.message.includes('vite:ws'))) {
          e.preventDefault();
        }
      });
    </script>
